aid: halcyon
name: Halcyon
description: >-
  Halcyon (Halcyon Tech, Inc.) is a cybersecurity company that builds a
  purpose-built, adaptive anti-ransomware and cyber-resilience platform. Its
  lightweight endpoint agent combines automated detection and disruption across
  the full ransomware attack lifecycle — pre-execution, encryption, and data
  exfiltration — with encryption-key recovery, a managed 24/7 Ransomware
  Operations Center (ROC), and a ransomware recovery warranty. Halcyon exposes a
  REST API for device/asset data and a universal API that streams alerts into
  SIEM, SOAR, and XDR platforms such as Splunk, Microsoft Sentinel, Google
  SecOps, Sumo Logic, and Exabeam, alongside backup integrations with Veeam,
  Cohesity, Acronis, and Commvault. Backed by Bain Capital Ventures and Obvious
  Ventures.
